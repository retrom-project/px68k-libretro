name: Retrom Core Quality
on:
  push:
    branches: ["retrom/**", "feat/**", "fix/**"]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source and regression tests
        run: |
          python3 .github/rpg-runtime/verify-source.py
          bash retrom/check.sh
          python3 -m unittest discover -s retrom/tests -p 'test_*.py'
      - name: Build fixed-toolchain WebAssembly candidate
        run: |
          mkdir -p "$RUNNER_TEMP/px68k-candidate"
          bash .github/rpg-runtime/build-candidate.sh "$RUNNER_TEMP/px68k-candidate"
